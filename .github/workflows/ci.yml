name: CI Build with AI Optimization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: CORE PIPELINE LOG CAPTURE
  # ─────────────────────────────────────────────────────────────
  execute-build:
    name: "Stage 1: Application Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Maintains the baseline error structure for the AI agent to evaluate
      - name: Compile and Verify Dependencies
        id: run_build
        run: |
          echo "Starting application build dependency validation..." > build_output.log
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt 2>&1 | tee -a build_output.log
          else
            echo "ERROR: Could not open requirements.txt: [Errno 2] No such file or directory: 'requirements.txt'" >> build_output.log
          fi
          cat build_output.log
        continue-on-error: true

      - name: Archive Build Log Telemetry
        uses: actions/upload-artifact@v4
        with:
          name: build-log-artifact
          path: build_output.log
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: AI OPTIMIZATION ANALYSIS
  # ─────────────────────────────────────────────────────────────
  ai-analysis:
    name: "Stage 2: GenAI Performance Analytics"
    runs-on: ubuntu-latest
    needs: execute-build
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Downloads the telemetry log string from Stage 1
      - name: Download Build Log Telemetry
        uses: actions/download-artifact@v4
        with:
          name: build-log-artifact

      - name: Initialize Dockerized Ollama Engine
        run: |
          docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama
          sleep 5
          docker exec ollama ollama pull qwen2.5-coder:7b

      - name: Execute Open Source Log Optimization Agent
        run: |
          python .github/scripts/analyze_logs.py build_output.log > ai_suggestions.md
          cat ai_suggestions.md >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: JAVA APP COMPILATION & SMOKE VERIFICATION
  # ─────────────────────────────────────────────────────────────
  run-java-test:
    name: "Stage 3: Java App Verification"
    runs-on: ubuntu-latest
    needs: ai-analysis # Stage 3 executes after the AI analytics job finishes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sets up standard Java JDK environment securely inside the runner container
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Compiles the standalone Java class bytecode natively
      - name: Compile Java Application
        run: |
          echo "Compiling App.java..."
          javac App.java

      # Executes the app file directly and catches the standard output streams
      - name: Execute Java App Smoke Verification
        run: |
          echo "Executing compiled class application file..."
          java App > java_execution.log 2>&1
          cat java_execution.log
          
          # Inject status feedback text summary back to the main actions console view
          if [ -f App.class ]; then
            echo "### ✅ Stage 3 Complete: Java App Compiled and Verified Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            cat java_execution.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Stage 3 Failed: Java execution compilation error." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
