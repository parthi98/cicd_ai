name: CI Build with AI Optimization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: CORE APPLICATION BUILD & TELEMETRY
  # ─────────────────────────────────────────────────────────────
  execute-build:
    name: "Stage 1: Application Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Creates output log framework cleanly for analysis
      - name: Compile and Verify Dependencies
        id: run_build
        run: |
          echo "Starting application build dependency validation..." > build_output.log
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt 2>&1 | tee -a build_output.log
          else
            echo "ERROR: Could not open requirements.txt: [Errno 2] No such file or directory: 'requirements.txt'" >> build_output.log
          fi
          cat build_output.log
        continue-on-error: true

      - name: Archive Build Log Telemetry
        uses: actions/upload-artifact@v4
        with:
          name: build-log-artifact
          path: build_output.log
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: AI OPTIMIZATION ANALYSIS
  # ─────────────────────────────────────────────────────────────
  ai-analysis:
    name: "Stage 2: GenAI Performance Analytics"
    runs-on: ubuntu-latest
    needs: execute-build
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Build Log Telemetry
        uses: actions/download-artifact@v4
        with:
          name: build-log-artifact

      - name: Initialize Dockerized Ollama Engine
        run: |
          docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama
          sleep 5
          docker exec ollama ollama pull qwen2.5-coder:7b

      # Analyzes the logs completely free inside the runner frame
      - name: Execute Open Source Log Optimization Agent
        run: |
          python .github/scripts/analyze_logs.py build_output.log > ai_suggestions.md
          cat ai_suggestions.md >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: APPLICATION HEALTH VERIFICATION (DOCKER CAPTURE)
  # ─────────────────────────────────────────────────────────────
  run-app-test:
    name: "Stage 3: App Smoke Verification"
    runs-on: ubuntu-latest
    needs: ai-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Runs the app container natively using a lightweight pre-built Python environment
      - name: Spin Up Application Container
        run: |
          echo "Building and running the application inside an isolated Docker container..."
          docker run -d -p 8000:8000 --name fast-app -v ${{ github.workspace }}:/app -w /app python:3.11-slim sh -c "pip install fastapi uvicorn && uvicorn app:app --host 0.0.0.0 --port 8000"
          
          echo "Waiting for app to initialize inside container..."
          for i in {1..15}; do
            if nc -z 127.0.0.1 8000; then
              echo "FastAPI container is up and listening on port 8000!"
              break
            fi
            echo "Port 8000 not active yet, sleeping 1s..."
            sleep 1
          done

      - name: Print Container Startup Logs
        run: docker logs fast-app

      - name: Send Verification Requests
        run: |
          echo "Pinging root endpoint..."
          curl -s http://127.0.0
          
          echo -e "\nPinging health route..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0health)
          echo "Application HTTP Verification Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "### ✅ Stage 3 Complete: Application is Online & Healthy!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Stage 3 Failed: Service returned abnormal status code $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
