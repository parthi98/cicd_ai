name: CI Build with AI Optimization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Replaces the broken curl command with the official marketplace step framework
      - name: Setup Ollama Engine
        uses: ollama-actions/setup-ollama@v0
        with:
          model: "qwen2.5-coder:7b"

      - name: Execute Application Build
        id: run_build
        run: |
          echo "Starting application build dependency validation..." > build_output.log
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt 2>&1 | tee -a build_output.log
          else
            echo "ERROR: Could not open requirements.txt: [Errno 2] No such file or directory: 'requirements.txt'" >> build_output.log
          fi
          cat build_output.log
        continue-on-error: true

      - name: Run Open Source Log Optimization Agent
        if: always()
        run: |
          python .github/scripts/analyze_logs.py build_output.log > ai_suggestions.md
          cat ai_suggestions.md >> $GITHUB_STEP_SUMMARY
