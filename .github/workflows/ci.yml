name: CI Build with AI Optimization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # IMPORTANT: Change 'npm run build' to whatever your actual build command is!
      - name: Execute Application Build
        id: run_build
        # REPLACE 'your-subfolder-name' WITH THE ACTUAL NAME OF YOUR FOLDER (e.g., app, frontend)
        working-directory: ./your-subfolder-name
        run: |
          echo "Starting application build..."
          npm run build 2>&1 | tee build_output.log
        continue-on-error: true


      - name: Install AI Engine Dependencies
        run: pip install openai

      - name: Run GenAI Log Optimization Agent
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/analyze_logs.py build_output.log > ai_suggestions.md
          cat ai_suggestions.md >> $GITHUB_STEP_SUMMARY


      # This final step ensures the workflow badge shows red if the actual build failed
      - name: Check Build Status
        if: steps.run_build.outcome == 'failure'
        run: exit 1
