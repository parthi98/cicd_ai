name: CI Build with AI Optimization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: CORE APPLICATION BUILD & TELEMETRY
  # ─────────────────────────────────────────────────────────────
  execute-build:
    name: "Stage 1: Application Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and Verify Dependencies
        id: run_build
        run: |
          echo "Starting application build dependency validation..." > build_output.log
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt 2>&1 | tee -a build_output.log
          else
            echo "ERROR: Could not open requirements.txt: [Errno 2] No such file or directory: 'requirements.txt'" >> build_output.log
          fi
          cat build_output.log
        continue-on-error: true

      - name: Archive Build Log Telemetry
        uses: actions/upload-artifact@v4
        with:
          name: build-log-artifact
          path: build_output.log
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: AI OPTIMIZATION ANALYSIS
  # ─────────────────────────────────────────────────────────────
  ai-analysis:
    name: "Stage 2: GenAI Performance Analytics"
    runs-on: ubuntu-latest
    needs: execute-build
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Download the captured logs from Stage 1
      - name: Download Build Log Telemetry
        uses: actions/download-artifact@v4
        with:
          name: build-log-artifact

      # Launch isolated local open source AI server engine
      - name: Initialize Dockerized Ollama Engine
        run: |
          docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama
          sleep 5
          docker exec ollama ollama pull qwen2.5-coder:7b

      # Process analysis logs locally via containerized qwen agent
      - name: Execute Open Source Log Optimization Agent
        run: |
          python .github/scripts/analyze_logs.py build_output.log > ai_suggestions.md
          cat ai_suggestions.md >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: APPLICATION HEALTH VERIFICATION
  # ─────────────────────────────────────────────────────────────
  run-app-test:
    name: "Stage 3: App Smoke Verification"
    runs-on: ubuntu-latest
    needs: ai-analysis # Stage 3 fires only after Stage 2 analysis is complete
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installs minimal dependencies required to execute the FastAPI demo app
      - name: Install Application Packages
        run: |
          pip install fastapi uvicorn requests

      # Boot up our simple microservice application, ping it, and check response codes
      # Boot up our microservice application cleanly, wait for it to listen, and ping it safely
      - name: Spin Up Application & Test Endpoints
        run: |
          echo "Starting the FastAPI server instance on localhost port 8000..."
          # Cleanly detach uvicorn streams so it runs completely independent of the shell lifecycle
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          
          echo "Waiting for FastAPI server to initialize and listen on port 8000..."
          # Robust check that pauses until port 8000 is open (max 10 seconds)
          for i in {1..10}; do
            if nc -z 127.0.0.1 8000; then
              echo "FastAPI server is up and listening!"
              break
            fi
            echo "Port 8000 not ready yet, sleeping 1s..."
            sleep 1
          done
          
          echo "Printing server startup log telemetry:"
          cat uvicorn.log
          
          echo "Sending verification ping request to app endpoint..."
          curl -s http://127.0.0
          
          echo -e "\nSending request to health check route..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0health)
          echo "Application HTTP Verification Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "### ✅ Stage 3 Complete: Application is Online & Healthy!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Stage 3 Failed: Service returned abnormal status code $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
